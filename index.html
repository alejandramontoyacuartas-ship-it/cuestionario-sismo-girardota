<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Sabe leer su casa? · Sismo Girardota</title>
<meta name="description" content="Cuestionario individual de la charla comunitaria sobre el sismo del 10 de agosto de 2026 · Alcaldía de Girardota">
<style>
  :root{
    --verde:#12745C; --verde-osc:#0c5644; --lima:#68C200;
    --rojo:#C62828; --naranja:#EF8A00; --gris:#5f6b66;
    --fondo:#f3f7f5; --tarjeta:#ffffff; --texto:#1d2b26; --borde:#d8e3de;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);
    font-family:"Arial Narrow",Arial,Helvetica,sans-serif;font-size:18px;line-height:1.4}
  header{background:var(--verde);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;
    border-bottom:5px solid var(--lima);position:sticky;top:0;z-index:5}
  header img{height:40px}
  header .t{font-weight:700;font-size:17px;line-height:1.15}
  header .t small{display:block;font-weight:400;opacity:.85;font-size:14px}
  header .pts{margin-left:auto;background:var(--lima);color:#0b2e24;font-weight:700;border-radius:20px;
    padding:4px 12px;font-size:16px;white-space:nowrap}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.05)}
  h1{color:var(--verde);font-size:30px;line-height:1.1;margin:4px 0 10px}
  h2{font-size:22px;line-height:1.2;margin:10px 0 6px}
  .kicker{color:var(--verde);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .tipo{color:var(--gris);font-size:15px;margin:0 0 12px}
  .bar{height:8px;background:#dfe9e4;border-radius:6px;overflow:hidden;margin:0 0 14px}
  .bar i{display:block;height:100%;background:var(--lima);transition:width .3s}
  .foto{width:100%;max-height:320px;object-fit:cover;border-radius:10px;display:block;background:#e7ece9;margin-top:8px}
  .valor{display:inline-block;background:#e6f4dc;color:var(--verde-osc);font-weight:700;border-radius:6px;
    padding:2px 8px;font-size:14px;margin-left:6px}

  /* opciones con imagen */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .imgop{position:relative;padding:0;border:3px solid var(--borde);border-radius:12px;background:#fff;
    overflow:hidden;cursor:pointer;font:inherit;text-align:left;color:var(--texto)}
  .imgop img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  .imgop .letra{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--verde);
    color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .imgop .nota{display:none;padding:6px 8px;font-size:14px;line-height:1.25}
  .imgop:hover:not(:disabled){border-color:var(--verde)}
  .imgop:disabled{cursor:default}
  .imgop.ok{border-color:var(--lima)} .imgop.ok .letra{background:var(--lima);color:#0b2e24}
  .imgop.mal{border-color:var(--rojo)} .imgop.mal .letra{background:var(--rojo)}
  .revelado .imgop .nota{display:block}

  /* semáforo */
  .sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .semop{border:3px solid transparent;border-radius:12px;padding:14px 6px;font:inherit;color:#fff;cursor:pointer;
    text-align:center;font-weight:700;font-size:20px;line-height:1.1}
  .semop small{display:block;font-weight:400;font-size:14px;margin-top:4px}
  .semop .luz{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);margin:0 auto 8px}
  .semop.v{background:#3d9a2b} .semop.n{background:var(--naranja)} .semop.r{background:var(--rojo)}
  .semop:disabled{cursor:default;opacity:.45}
  .semop.ok{opacity:1;border-color:#0b2e24;box-shadow:0 0 0 3px var(--lima)}
  .semop.mal{opacity:1;border-color:#0b2e24}

  /* selección múltiple */
  .ops{display:grid;gap:10px;margin-top:6px}
  .chk{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:10px;border:2px solid var(--borde);
    background:#fff;cursor:pointer;font-size:18px}
  .chk input{width:24px;height:24px;flex:0 0 24px;margin:1px 0 0;accent-color:var(--verde)}
  .chk.sel{border-color:var(--verde);background:#f2f9f5}
  .chk.ok{border-color:var(--lima);background:#eef8e6}
  .chk.mal{border-color:var(--rojo);background:#fdeeee}
  .chk.falto{border-color:var(--naranja);border-style:dashed}
  .chk .marca{margin-left:auto;font-weight:700;white-space:nowrap;font-size:15px}

  .fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:17px}
  .fb.ok{background:#eef8e6;border-left:6px solid var(--lima)}
  .fb.mal{background:#fff4e5;border-left:6px solid var(--naranja)}
  .fb strong{display:block;font-size:19px;margin-bottom:2px}
  .btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:10px;font:inherit;
    font-size:20px;font-weight:700;background:var(--verde);color:#fff;cursor:pointer}
  .btn:disabled{background:#9db8ae;cursor:default}
  .btn.sec{background:#fff;color:var(--verde);border:2px solid var(--verde)}
  label.f{display:block;font-weight:700;margin:12px 0 4px}
  input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--borde);border-radius:10px}
  .aviso{color:var(--rojo);font-size:15px;min-height:20px;margin-top:4px}
  .grande{font-size:76px;font-weight:700;color:var(--verde);line-height:1;text-align:center;margin:8px 0 0}
  .grande small{font-size:30px;color:var(--gris)}
  .nivel{text-align:center;font-size:22px;font-weight:700;margin:8px 0 4px}
  .resumen{list-style:none;padding:0;margin:14px 0 0}
  .resumen li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--borde);font-size:16px}
  .resumen .s{font-weight:700;white-space:nowrap}
  .semaforo{display:flex;gap:6px;margin:12px 0}
  .semaforo span{flex:1;height:10px;border-radius:5px}
  .hora{text-align:center;color:var(--gris);font-size:14px;margin:4px 0 0}
  footer{text-align:center;color:var(--gris);font-size:13px;padding:18px 16px 30px}
  #qrbox{display:flex;justify-content:center;margin:12px 0}
  #qrbox img,#qrbox canvas{width:min(80vw,420px)!important;height:auto!important}
  .url{word-break:break-all;text-align:center;font-size:16px;color:var(--verde-osc)}
  .oculto{display:none}
</style>
</head>
<body>
<header>
  <img src="img/logo.png" alt="Alcaldía de Girardota">
  <div class="t">¿Sabe leer su casa?<small>Charla comunitaria · Sismo 10-ago-2026</small></div>
  <div class="pts oculto" id="marcador">0 pts</div>
</header>
<main id="app"></main>
<footer>Alcaldía de Girardota · Gestión del Riesgo de Desastres<br>girardota.gov.co · @alcaldiagirardota</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* Tipos:
   img   → elegir UNA foto entre varias (única respuesta)
   sem   → ver una foto y elegir UN color del semáforo (única respuesta)
   multi → selección múltiple: marcar TODAS las correctas (puntaje parcial)
   Fotos: visitas técnicas del sismo en Girardota, recortadas sin datos de ubicación. */
const PREGUNTAS = [
  { tipo:"img", pts:6,
    q:"Después del temblor, don Jorge encontró estas cuatro rayas en paredes de su casa. Solo una la puede resanar él mismo y quedarse vigilándola, sin esperar visita técnica. ¿Cuál?",
    ops:[ {img:"img/afec66.jpg", nota:"Grieta abierta que atraviesa la tapia: revisión técnica"},
          {img:"img/afec82.jpg", nota:"Fisura en el revoque, sin profundidad: resanar y vigilar"},
          {img:"img/afec72.jpg", nota:"Grietas en las uniones de muros de tapia: uso restringido"},
          {img:"img/afec81.jpg", nota:"Grieta junto a un cielo raso caído: revisión técnica"} ],
    ok:1, exp:"La fisura va solo por el pañete o la pintura y no atraviesa el muro. Las otras comprometen el muro o la cubierta y requieren revisión técnica." },

  { tipo:"img", pts:6,
    q:"Las cuatro paredes quedaron con rayas tras el sismo. En tres, el daño es superficial; en una, la raya ya compromete el muro. ¿Cuál NO se debe limitar a resanar?",
    ops:[ {img:"img/afec64.jpg", nota:"Fisuras superficiales en el revoque: sin riesgo"},
          {img:"img/afec50.jpg", nota:"Raya irregular poco profunda: sin riesgo, vigilar"},
          {img:"img/afec66.jpg", nota:"Grieta abierta, se ve la sombra y atraviesa la tapia"},
          {img:"img/afec82.jpg", nota:"Fisura en el revoque: resanar y vigilar"} ],
    ok:2, exp:"Una grieta está abierta, se ve la sombra y atraviesa el muro o corre por columnas, vigas o uniones. Resanarla solo la esconde: necesita revisión técnica." },

  { tipo:"multi", pts:8,
    q:"Según lo visto en la charla, ¿cuáles de estas afirmaciones sobre cómo leer una grieta son CIERTAS?",
    ops:[ {t:"Una grieta diagonal o en forma de X indica que la empujó el temblor.", ok:true},
          {t:"El ancho es lo único que define si una grieta es peligrosa.", ok:false},
          {t:"Si un lado de la grieta quedó más afuera que el otro (escalón), eso pesa más que el ancho.", ok:true},
          {t:"Si la grieta ya existía antes del temblor, no hace falta vigilarla.", ok:false},
          {t:"Una grieta delgada que cada semana está más larga necesita atención.", ok:true},
          {t:"Si la grieta se ve por el otro lado del muro, es porque lo atraviesa.", ok:true} ],
    exp:"El técnico mira ancho, dirección, si atraviesa el muro, si tiene escalón y si está creciendo. El escalón y el crecimiento pesan más que el ancho, y las grietas viejas también se vigilan." },

  { tipo:"img", pts:6,
    q:"Las tres sintieron el mismo sismo. ¿En cuál los muros pierden resistencia cuando se humedecen y la cubierta suele quedar apoyada sin anclaje?",
    ops:[ {img:"img/edu26.jpg", nota:"Mampostería confinada (columnas y vigas): menos vulnerable"},
          {img:"img/afec70.jpg", nota:"Tapia: muy alta vulnerabilidad"},
          {img:"img/inf6.jpg", nota:"Ladrillo con estructura: menos vulnerable"} ],
    ok:1, exp:"Es la casa de TAPIA: tierra pesada que se debilita con la humedad, con el techo apoyado sin anclar. 7 de las 12 casas en estado crítico en Girardota eran de tapia." },

  { tipo:"multi", pts:8,
    q:"El mismo temblor dejó casas vecinas con daños muy distintos. ¿Cuáles afirmaciones lo explican correctamente?",
    ops:[ {t:"Como el epicentro fue en el Chocó, a más de 100 km de profundidad, el sismo no podía causar daños en Girardota.", ok:false},
          {t:"Una casa con goteras y humedad de años puede dañarse más con el mismo temblor.", ok:true},
          {t:"Una ampliación sin amarre a la construcción original es un punto débil.", ok:true},
          {t:"Una casa de ladrillo siempre resiste, tenga o no columnas y vigas.", ok:false},
          {t:"Los cortes, rellenos y el agua lluvia en la ladera influyen en el daño.", ok:true},
          {t:"Si dos casas sintieron el mismo temblor, el daño depende solo de qué tan fuerte fue.", ok:false} ],
    exp:"Influyen cómo se construyó, dónde está parada y cómo se ha cuidado. Aunque fue lejos y profundo, la energía viajó hasta el Valle de Aburrá. El ladrillo apilado sin columnas ni vigas tiene alta vulnerabilidad." },

  { tipo:"img", pts:6,
    q:"En uno de estos casos, el técnico advirtió que reforzar los muros no basta si no se controla lo que pasa por fuera de la construcción. ¿Cuál?",
    ops:[ {img:"img/inf6.jpg", nota:"Edificio en terreno plano, zona urbana"},
          {img:"img/edu26.jpg", nota:"Edificio con estructura, en terreno estable"},
          {img:"img/afec74.jpg", nota:"Vivienda en alta pendiente: el terreno también se revisa"} ],
    ok:2, exp:"En ladera, los cortes, los rellenos y el agua lluvia que se mete al terreno pueden mover la casa. Por eso, en la visita, el técnico también mira alrededor." },

  { tipo:"img", pts:6,
    q:"En una de estas paredes el daño no se soluciona resanando ni reforzando el muro, porque la causa sigue actuando todos los días. ¿Cuál?",
    ops:[ {img:"img/afec82.jpg", nota:"Fisura seca en el revoque"},
          {img:"img/inf4.jpg", nota:"Humedad junto a un bajante: pañete inflado y descascarado"},
          {img:"img/afec72.jpg", nota:"Grietas en uniones de muros de tapia"},
          {img:"img/afec64.jpg", nota:"Fisuras superficiales sin humedad"} ],
    ok:1, exp:"El agua debilita muros y losas; muchas veces el temblor solo suelta lo que la humedad ya había dañado. Canoas y bajantes sanos, que no descarguen al pie del muro." },

  { tipo:"sem", pts:6, img:"img/afec23.jpg",
    q:"Apartamento en el centro: las rayas siguen la unión entre el muro de ladrillo y la viga; las columnas no muestran daño y nada se ve por el otro lado del muro. Según la metodología unificada, ¿qué color corresponde?",
    ok:"v", exp:"VERDE: se puede habitar. Las fisuras están en la unión muro-viga y la estructura está sana: se resana y se vigila. En Girardota 33 casas quedaron en verde." },

  { tipo:"sem", pts:6, img:"img/afec72.jpg",
    q:"Casa de tapia en una vereda: grietas abiertas donde se unen los muros; el techo sigue en su sitio y los muros no están inclinados. Vive una adulta mayor. ¿Qué color corresponde?",
    ok:"n", exp:"NARANJA (en el país se llama amarillo): uso restringido. No usar la parte dañada y reforzar pronto; aquí se recomendó confinar con columnas y vigas. No es rojo porque no hay riesgo inminente de colapso." },

  { tipo:"sem", pts:6, img:"img/afec98.jpg",
    q:"Casa de tapia: varias vigas de madera de la cubierta están descompuestas por la humedad y se apoyan directamente sobre la tapia; algunas piezas ya cedieron. ¿Qué color corresponde?",
    ok:"r", exp:"ROJO: crítico, no entrar a esa zona por riesgo de colapso de la cubierta. Ojo: el rojo NO es una orden de demoler. Se recomendó no usar la zona y cambiar la cubierta." },

  { tipo:"multi", pts:8,
    q:"¿En cuáles de estas situaciones lo correcto es SALIR de inmediato con la familia y llamar, sin quedarse a medir?",
    ops:[ {t:"Un muro que se ve inclinado o barrigón.", ok:true},
          {t:"Una fisura delgada que no ha crecido en tres semanas.", ok:false},
          {t:"Un muro que quedó despegado del techo.", ok:true},
          {t:"Pintura descascarada por humedad, sin grietas en el muro.", ok:false},
          {t:"Grietas en el patio y un suelo que se está corriendo.", ok:true},
          {t:"Una grieta con escalón que crece día a día.", ok:true} ],
    exp:"Señales de peligro: muro inclinado o barrigón, grietas en X, columna o viga partida, grieta con escalón, grieta que crece, techo que se hunde o cruje, muro despegado del techo y suelo que se corre." },

  { tipo:"img", pts:6,
    q:"Doña Rosa ve estos cuatro daños en su casa mientras espera al técnico. ¿Cuál la obliga a sacar ya a la familia de esa zona?",
    ops:[ {img:"img/afec82.jpg", nota:"Fisura: resanar y vigilar"},
          {img:"img/afec72.jpg", nota:"Grietas en uniones de tapia: restringir uso, reforzar"},
          {img:"img/afec37b.jpg", nota:"Techo que se rompe y se hunde: salir y llamar"},
          {img:"img/afec64.jpg", nota:"Fisuras superficiales: vigilar"} ],
    ok:2, exp:"Un techo que se hunde o se rompe es señal de peligro inmediato: salga, quédese afuera y llame al 123 o a Gestión del Riesgo. Las grietas de tapia exigen restringir y reforzar, pero no evacuación inmediata." },

  { tipo:"img", pts:6,
    q:"La familia culpó al sismo, pero el técnico concluyó que la causa principal venía de años atrás y que el temblor solo la destapó. ¿En cuál de estos casos?",
    ops:[ {img:"img/afec50.jpg", nota:"Raya irregular reciente, poco profunda"},
          {img:"img/afec81.jpg", nota:"Cielo raso caído por un techo de tapia sin mantenimiento"},
          {img:"img/afec72.jpg", nota:"Grietas en uniones de muros de tapia"},
          {img:"img/afec23.jpg", nota:"Fisuras en la unión muro-viga"} ],
    ok:1, exp:"El cielo raso se cayó por falta de mantenimiento del techo. Decir la verdad sobre la causa define quién repara y qué ruta de apoyo aplica." },

  { tipo:"multi", pts:8,
    q:"Su casa quedó con una grieta y está en ladera. ¿Cuáles de estas acciones AYUDAN a que la casa aguante?",
    ops:[ {t:"Marcar las puntas de la grieta con lápiz y fecha, y tomarle foto cada semana.", ok:true},
          {t:"Rellenar la grieta con cemento de una vez, para que no se note si sigue creciendo.", ok:false},
          {t:"Revisar que canoas y bajantes no descarguen el agua al pie del muro.", ok:true},
          {t:"Hacer un corte pequeño en la ladera detrás de la casa para ganar espacio.", ok:false},
          {t:"Construir un segundo piso sobre los muros de tapia, si se usan buenos materiales.", ok:false},
          {t:"Anclar la madera del techo al muro y mantener las tejas en su sitio.", ok:true},
          {t:"Acordar en familia un punto de encuentro y tener un kit listo.", ok:true} ],
    exp:"Marcar y vigilar la grieta, sacar el agua lluvia, cuidar el techo y preparar a la familia. No cortar ni rellenar el terreno sin asesoría, y ampliar solo bien amarrado, con licencia y norma NSR-10." },

  { tipo:"multi", pts:8,
    q:"Sobre lo que pasa después de reportar un daño, ¿cuáles afirmaciones son CIERTAS?",
    ops:[ {t:"Se atiende primero lo grave y donde viven niños, adultos mayores o personas con discapacidad.", ok:true},
          {t:"Si la casa queda en rojo, la Alcaldía ordena demolerla.", ok:false},
          {t:"La revisión rápida (fase 1) pone un color provisional, no definitivo.", ok:true},
          {t:"Las casas en amarillo y rojo pasan a una revisión detallada (fase 2).", ok:true},
          {t:"Para recibir apoyo no hace falta estar en el Registro Único de Damnificados (RUD).", ok:false},
          {t:"Al reportar, conviene enviar fotos de cerca y de lejos.", ok:true} ],
    exp:"La UNGRD fija tres fases: revisión rápida (color provisional), revisión detallada para amarillas y rojas, y panel de expertos. El rojo no es orden de demoler. El apoyo exige estar en el RUD." }
];
const TOTAL = PREGUNTAS.reduce((s,p)=>s+p.pts,0);
const SEM = { v:["VERDE","Habitable"], n:["NARANJA","Uso restringido"], r:["ROJO","Crítico"] };
const app = document.getElementById('app');
const marcador = document.getElementById('marcador');
let st, PQ = PREGUNTAS;
// Cada persona recibe las opciones en distinto orden (no se copia la letra del vecino).
function barajar(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function prepararPreguntas(){
  return PREGUNTAS.map(p => {
    if (p.tipo === 'img') { const orden = barajar(p.ops.map((_,k)=>k)); return {...p, ops:orden.map(k=>p.ops[k]), ok:orden.indexOf(p.ok)}; }
    if (p.tipo === 'multi') return {...p, ops:barajar(p.ops)};
    return p;
  });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (Math.round(n*10)/10).toString().replace('.', ',');
function setMarcador(){ marcador.textContent = fmt(st.puntos) + " pts"; }

function inicio(){
  marcador.classList.add('oculto');
  const nImg = PREGUNTAS.filter(p=>p.tipo!=='multi').length, nMul = PREGUNTAS.length - nImg;
  app.innerHTML = `
  <div class="card">
    <div class="kicker">Sismo del 10 de agosto de 2026</div>
    <h1>¿Sabe leer su casa después de un temblor?</h1>
    <img class="foto" src="img/p7.jpg" alt="Casa en Girardota">
    <p>Cuestionario <b>individual</b> de <b>${PREGUNTAS.length} preguntas</b> con fotos reales de las visitas en Girardota:</p>
    <ul style="margin:0 0 6px;padding-left:22px">
      <li><b>${nImg}</b> de elegir <b>una</b> foto o color</li>
      <li><b>${nMul}</b> de <b>selección múltiple</b> (marque todas las correctas)</li>
    </ul>
    <p style="margin:6px 0">En total puede sumar <b>${TOTAL} puntos</b>.</p>
    <div class="semaforo"><span style="background:var(--lima)"></span><span style="background:var(--naranja)"></span><span style="background:var(--rojo)"></span></div>
    <label class="f" for="nom">Su nombre completo *</label>
    <input type="text" id="nom" maxlength="50" autocomplete="name" placeholder="Nombre y apellido">
    <label class="f" for="ver">Vereda o barrio (opcional)</label>
    <input type="text" id="ver" maxlength="40" placeholder="Ej.: San Andrés">
    <div class="aviso" id="aviso"></div>
    <button class="btn" id="go">Empezar</button>
  </div>`;
  document.getElementById('go').onclick = () => {
    const nombre = document.getElementById('nom').value.trim();
    if (nombre.length < 3) { document.getElementById('aviso').textContent = "Escriba su nombre para empezar."; return; }
    PQ = prepararPreguntas();
    st = { i:0, puntos:0, nombre, vereda:document.getElementById('ver').value.trim(), resp:[] };
    marcador.classList.remove('oculto'); setMarcador(); pregunta();
  };
}

function cabecera(p){
  const tipos = { img:"Elija UNA foto", sem:"Elija UN color", multi:"Selección múltiple: marque TODAS las correctas" };
  return `<div class="bar"><i style="width:${st.i/PREGUNTAS.length*100}%"></i></div>
  <div class="card">
    <div class="kicker">Pregunta ${st.i+1} de ${PREGUNTAS.length} <span class="valor">${p.pts} puntos</span></div>
    <h2>${esc(p.q)}</h2>
    <p class="tipo">${tipos[p.tipo]}</p>`;
}

function pregunta(){
  const p = PQ[st.i];
  let cuerpo = "";
  if (p.tipo === "img") {
    cuerpo = `<div class="grid" id="opts">${p.ops.map((o,k)=>`
      <button class="imgop" data-k="${k}"><img src="${o.img}" alt="Opción ${"ABCD"[k]}"><span class="letra">${"ABCD"[k]}</span><span class="nota">${esc(o.nota)}</span></button>`).join('')}</div>`;
  } else if (p.tipo === "sem") {
    cuerpo = `<img class="foto" src="${p.img}" alt="Foto de la visita">
      <div class="sem">${Object.keys(SEM).map(c=>`<button class="semop ${c}" data-c="${c}"><div class="luz"></div>${SEM[c][0]}<small>${SEM[c][1]}</small></button>`).join('')}</div>`;
  } else {
    cuerpo = `<div class="ops">${p.ops.map((o,k)=>`
      <label class="chk" data-k="${k}"><input type="checkbox" value="${k}"><span>${esc(o.t)}</span><span class="marca"></span></label>`).join('')}</div>
      <button class="btn" id="calif" disabled>Calificar</button>`;
  }
  app.innerHTML = cabecera(p) + cuerpo + `<div id="fb"></div></div>`;

  if (p.tipo === "img") app.querySelectorAll('.imgop').forEach(b => b.onclick = () => respUnica(+b.dataset.k));
  if (p.tipo === "sem") app.querySelectorAll('.semop').forEach(b => b.onclick = () => respSem(b.dataset.c));
  if (p.tipo === "multi") {
    const cal = document.getElementById('calif');
    app.querySelectorAll('.chk input').forEach(inp => inp.onchange = () => {
      inp.parentElement.classList.toggle('sel', inp.checked);
      cal.disabled = !app.querySelector('.chk input:checked');
    });
    cal.onclick = respMulti;
  }
  window.scrollTo(0,0);
}

function cerrar(pts, titulo, bien){
  const p = PQ[st.i];
  st.puntos += pts; st.resp.push({ pts }); setMarcador();
  const ultima = st.i === PREGUNTAS.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="fb ${bien?'ok':'mal'}"><strong>${titulo}</strong>${esc(p.exp)}</div>
    <button class="btn" id="sig">${ultima?'Ver mi puntaje':'Siguiente'}</button>`;
  document.getElementById('sig').onclick = () => { st.i++; ultima ? final() : pregunta(); };
  document.getElementById('sig').scrollIntoView({behavior:'smooth', block:'end'});
}

function respUnica(k){
  const p = PQ[st.i], bien = k === p.ok;
  const btns = app.querySelectorAll('.imgop');
  btns.forEach(b => b.disabled = true);
  btns[p.ok].classList.add('ok'); if (!bien) btns[k].classList.add('mal');
  document.getElementById('opts').classList.add('revelado');
  cerrar(bien ? p.pts : 0, bien ? `¡Correcto! +${p.pts} puntos` : `No era esa. La correcta es la ${"ABCD"[p.ok]}`, bien);
}

function respSem(c){
  const p = PQ[st.i], bien = c === p.ok;
  app.querySelectorAll('.semop').forEach(b => { b.disabled = true;
    if (b.dataset.c === p.ok) b.classList.add('ok'); else if (b.dataset.c === c) b.classList.add('mal'); });
  cerrar(bien ? p.pts : 0, bien ? `¡Correcto! +${p.pts} puntos` : `No era ese color`, bien);
}

function respMulti(){
  const p = PQ[st.i];
  const total = p.ops.filter(o=>o.ok).length;
  let aciertos = 0, errores = 0;
  app.querySelectorAll('.chk').forEach(l => {
    const o = p.ops[+l.dataset.k], inp = l.querySelector('input'), m = l.querySelector('.marca');
    inp.disabled = true; l.classList.remove('sel');
    if (inp.checked && o.ok) { aciertos++; l.classList.add('ok'); m.textContent = "✔ bien"; }
    else if (inp.checked && !o.ok) { errores++; l.classList.add('mal'); m.textContent = "✘ no va"; }
    else if (!inp.checked && o.ok) { l.classList.add('falto'); m.textContent = "faltó"; }
  });
  document.getElementById('calif').remove();
  // Cada correcta marcada suma; cada incorrecta marcada resta. Mínimo 0.
  const pts = Math.max(0, aciertos - errores) / total * p.pts;
  const completo = aciertos === total && errores === 0;
  cerrar(pts, completo ? `¡Perfecto! +${p.pts} puntos` : `${aciertos} de ${total} correctas${errores?`, ${errores} de más`:''} · +${fmt(pts)} puntos`, completo);
}

function final(){
  const pc = st.puntos / TOTAL;
  const nivel = pc >= .8 ? ['Experto en leer la casa','var(--verde)']
              : pc >= .5 ? ['Va por buen camino','var(--naranja)']
              : ['Repasemos juntos','var(--rojo)'];
  const ahora = new Date().toLocaleString('es-CO', { dateStyle:'medium', timeStyle:'short' });
  app.innerHTML = `
  <div class="bar"><i style="width:100%"></i></div>
  <div class="card">
    <div class="kicker" style="text-align:center">${esc(st.nombre)}${st.vereda ? ' · ' + esc(st.vereda) : ''}</div>
    <div class="grande">${fmt(st.puntos)}<small> / ${TOTAL}</small></div>
    <div class="nivel" style="color:${nivel[1]}">${nivel[0]}</div>
    <p class="hora">${ahora}</p>
    <p style="text-align:center;color:var(--gris);font-size:15px">Muestre esta pantalla al equipo de la Alcaldía.</p>
    <ul class="resumen">${PQ.map((p,j)=>{ const r = st.resp[j].pts, c = r >= p.pts ? 'var(--verde)' : r > 0 ? 'var(--naranja)' : 'var(--rojo)';
      return `<li><span>${j+1}. ${esc(p.q.length > 62 ? p.q.slice(0,60) + '…' : p.q)}</span><span class="s" style="color:${c}">${fmt(r)}/${p.pts}</span></li>`; }).join('')}</ul>
    <img class="foto" src="img/p8.jpg" alt="Infografía Lectura de patologías en vivienda" style="object-fit:contain;max-height:none;margin-top:16px">
    <div class="fb ok"><strong>Recuerde</strong>Una grieta es un mensaje de la casa. Si ve señales de peligro, salga, quédese afuera y llame al 123.</div>
    <button class="btn sec" id="otra">Volver al inicio</button>
  </div>`;
  document.getElementById('otra').onclick = inicio;
  window.scrollTo(0,0);
}

function vistaQR(){
  marcador.classList.add('oculto');
  const url = location.href.split('#')[0];
  app.innerHTML = `
  <div class="card" style="text-align:center">
    <div class="kicker">Escanee con la cámara del celular</div>
    <h1 style="margin-bottom:0">¿Sabe leer su casa?</h1>
    <p style="margin:6px 0 0">Cuestionario individual · ${PREGUNTAS.length} preguntas · ${TOTAL} puntos</p>
    <div id="qrbox"></div>
    <div class="url">${esc(url)}</div>
  </div>`;
  if (window.QRCode) new QRCode(document.getElementById('qrbox'), { text:url, width:420, height:420, colorDark:"#0c5644", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
  else document.getElementById('qrbox').textContent = "No se pudo cargar el generador de QR (revise la conexión).";
}

function ruta(){ location.hash === '#qr' ? vistaQR() : inicio(); }
window.addEventListener('hashchange', ruta);
ruta();
</script>
</body>
</html>

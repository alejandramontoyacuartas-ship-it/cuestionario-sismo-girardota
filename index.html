<head>

<title>¿Sabe leer su casa? · Sismo Girardota</title>
<meta name="description" content="Cuestionario individual de la charla comunitaria sobre el sismo del 10 de agosto de 2026 · Alcaldía de Girardota">
<style>
  :root{
    --verde:#12745C; --verde-osc:#0c5644; --lima:#68C200;
    --rojo:#C62828; --naranja:#EF8A00; --gris:#5f6b66;
    --fondo:#f3f7f5; --tarjeta:#ffffff; --texto:#1d2b26; --borde:#d8e3de;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);
    font-family:"Arial Narrow",Arial,Helvetica,sans-serif;font-size:18px;line-height:1.4}
  header{background:var(--verde);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;
    border-bottom:5px solid var(--lima);position:sticky;top:0;z-index:5}
  header img{height:40px}
  header .t{font-weight:700;font-size:17px;line-height:1.15}
  header .t small{display:block;font-weight:400;opacity:.85;font-size:14px}
  header .pts{margin-left:auto;background:var(--lima);color:#0b2e24;font-weight:700;border-radius:20px;
    padding:4px 12px;font-size:16px;white-space:nowrap}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.05)}
  h1{color:var(--verde);font-size:30px;line-height:1.1;margin:4px 0 10px}
  h2{font-size:22px;line-height:1.2;margin:10px 0 6px}
  .kicker{color:var(--verde);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  .tipo{color:var(--gris);font-size:15px;margin:0 0 12px}
  .bar{height:8px;background:#dfe9e4;border-radius:6px;overflow:hidden;margin:0 0 14px}
  .bar i{display:block;height:100%;background:var(--lima);transition:width .3s}
  .foto{width:100%;max-height:320px;object-fit:cover;border-radius:10px;display:block;background:#e7ece9;margin-top:8px}
  .valor{display:inline-block;background:#e6f4dc;color:var(--verde-osc);font-weight:700;border-radius:6px;
    padding:2px 8px;font-size:14px;margin-left:6px}

  /* opciones con imagen */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .imgop{position:relative;padding:0;border:3px solid var(--borde);border-radius:12px;background:#fff;
    overflow:hidden;cursor:pointer;font:inherit;text-align:left;color:var(--texto)}
  .imgop img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  .imgop .letra{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--verde);
    color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.35)}
  .imgop .nota{display:none;padding:6px 8px;font-size:14px;line-height:1.25}
  .imgop:hover:not(:disabled){border-color:var(--verde)}
  .imgop:disabled{cursor:default}
  .imgop.ok{border-color:var(--lima)} .imgop.ok .letra{background:var(--lima);color:#0b2e24}
  .imgop.mal{border-color:var(--rojo)} .imgop.mal .letra{background:var(--rojo)}
  .revelado .imgop .nota{display:block}
  .imgop.sel{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde)}
  .imgop.sel .letra{background:var(--lima);color:#0b2e24}
  .imgop.sel::after{content:"✔";position:absolute;top:6px;right:8px;font-size:22px;font-weight:700;color:#fff;
    background:var(--verde);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .imgop.falto{border-color:var(--naranja);border-style:dashed}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .op{width:100%;text-align:left;font:inherit;font-size:18px;padding:13px 14px;border-radius:10px;
    border:2px solid var(--borde);background:#fff;color:var(--texto);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
  .op b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:15px}
  .op:hover:not(:disabled){border-color:var(--verde)}
  .op:disabled{cursor:default}
  .op.ok{border-color:var(--lima);background:#eef8e6} .op.ok b{background:var(--lima);color:#0b2e24}
  .op.mal{border-color:var(--rojo);background:#fdeeee} .op.mal b{background:var(--rojo)}

  /* semáforo */
  .sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .semop{border:3px solid transparent;border-radius:12px;padding:14px 6px;font:inherit;color:#fff;cursor:pointer;
    text-align:center;font-weight:700;font-size:20px;line-height:1.1}
  .semop small{display:block;font-weight:400;font-size:14px;margin-top:4px}
  .semop .luz{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);margin:0 auto 8px}
  .semop.v{background:#3d9a2b} .semop.n{background:var(--naranja)} .semop.r{background:var(--rojo)}
  .semop:disabled{cursor:default;opacity:.45}
  .semop.ok{opacity:1;border-color:#0b2e24;box-shadow:0 0 0 3px var(--lima)}
  .semop.mal{opacity:1;border-color:#0b2e24}

  /* selección múltiple */
  .ops{display:grid;gap:10px;margin-top:6px}
  .chk{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:10px;border:2px solid var(--borde);
    background:#fff;cursor:pointer;font-size:18px}
  .chk input{width:24px;height:24px;flex:0 0 24px;margin:1px 0 0;accent-color:var(--verde)}
  .chk.sel{border-color:var(--verde);background:#f2f9f5}
  .chk.ok{border-color:var(--lima);background:#eef8e6}
  .chk.mal{border-color:var(--rojo);background:#fdeeee}
  .chk.falto{border-color:var(--naranja);border-style:dashed}
  .chk .marca{margin-left:auto;font-weight:700;white-space:nowrap;font-size:15px}

  .fb{margin-top:14px;border-radius:10px;padding:12px 14px;font-size:17px}
  .fb.ok{background:#eef8e6;border-left:6px solid var(--lima)}
  .fb.mal{background:#fff4e5;border-left:6px solid var(--naranja)}
  .fb strong{display:block;font-size:19px;margin-bottom:2px}
  .btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:10px;font:inherit;
    font-size:20px;font-weight:700;background:var(--verde);color:#fff;cursor:pointer}
  .btn:disabled{background:#9db8ae;cursor:default}
  .btn.sec{background:#fff;color:var(--verde);border:2px solid var(--verde)}
  label.f{display:block;font-weight:700;margin:12px 0 4px}
  input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px;border:2px solid var(--borde);border-radius:10px}
  .aviso{color:var(--rojo);font-size:15px;min-height:20px;margin-top:4px}
  .grande{font-size:76px;font-weight:700;color:var(--verde);line-height:1;text-align:center;margin:8px 0 0}
  .grande small{font-size:30px;color:var(--gris)}
  .nivel{text-align:center;font-size:22px;font-weight:700;margin:8px 0 4px}
  .resumen{list-style:none;padding:0;margin:14px 0 0}
  .resumen li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--borde);font-size:16px}
  .resumen .s{font-weight:700;white-space:nowrap}
  .semaforo{display:flex;gap:6px;margin:12px 0}
  .semaforo span{flex:1;height:10px;border-radius:5px}
  .hora{text-align:center;color:var(--gris);font-size:14px;margin:4px 0 0}
  footer{text-align:center;color:var(--gris);font-size:13px;padding:18px 16px 30px}
  #qrbox{display:flex;justify-content:center;margin:12px 0}
  #qrbox img,#qrbox canvas{width:min(80vw,420px)!important;height:auto!important}
  .url{word-break:break-all;text-align:center;font-size:16px;color:var(--verde-osc)}
  .oculto{display:none}
  .envio{text-align:center;font-size:16px;margin:6px 0 0;min-height:22px}
  .envio.ok{color:var(--verde);font-weight:700} .envio.err{color:var(--rojo)}

  /* Pantalla de proyección: QR + ranking en vivo */
  body.pantalla main{max-width:1500px}
  body.pantalla footer{display:none}
  .pant{display:grid;grid-template-columns:1fr;gap:16px}
  .pant .qrcol{display:flex;align-items:center;justify-content:center;gap:32px;flex-wrap:wrap}
  .qrtxt{max-width:560px}
  .qrtxt h1{font-size:44px}
  .qrtxt .pasos{font-size:22px;margin:8px 0 0}
  body.pantalla header{position:static}
  body.pantalla main{padding-top:10px}
  .pant #qrbox{margin:0}
  .pant #qrbox img,.pant #qrbox canvas{width:270px!important;height:270px!important}
  .cuenta{font-size:20px;margin:10px 0 0}
  .cuenta b{font-size:34px;color:var(--verde)}
  .rk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .rk-h h1{margin:0}
  .vivo{font-size:15px;color:var(--gris)} .vivo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lima);margin-right:6px;animation:lat 1.4s infinite}
  @keyframes lat{50%{opacity:.25}}
  .rk{list-style:none;margin:12px 0 0;padding:0}
  .rk li{display:grid;grid-template-columns:52px 46px 1fr auto auto;gap:12px;align-items:center;padding:5px 12px;border-radius:10px;
    margin-bottom:5px;background:#fff;border:1px solid var(--borde);cursor:pointer;font-size:21px}
  .rk li:hover{border-color:var(--verde)}
  .rk li.gana{background:#eef8e6;border:2px solid var(--lima)}
  .rk .pos{font-weight:700;font-size:26px;text-align:center;color:var(--verde-osc)}
  .rk li.gana .pos{background:var(--verde);color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin:auto}
  .rk li.oro .pos{background:#C9A227} .rk li.plata .pos{background:#8E9AA3} .rk li.bronce .pos{background:#A86A3D}
  .rk .ico{font-size:36px;line-height:1;text-align:center}
  .rk li.oro{background:#fff8dc;border-color:#C9A227}
  .tag{display:inline-block;background:#C9A227;color:#fff;font-size:14px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .rk .nom{font-weight:700;line-height:1.1} .rk .nom small{display:block;font-weight:400;font-size:16px;color:var(--gris)}
  .rk .t{font-size:15px;line-height:1.15;color:var(--gris);text-align:right;white-space:nowrap}
  .rk .p{font-weight:700;font-size:28px;color:var(--verde);min-width:80px;text-align:right}
  .corte{margin:14px 0 8px;font-size:15px;color:var(--gris);text-transform:uppercase;letter-spacing:.06em;border-top:2px dashed var(--borde);padding-top:10px}
  .vacio{color:var(--gris);font-size:20px;padding:30px 0;text-align:center}
  .det{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .det .card{max-width:640px;width:100%;max-height:90vh;overflow:auto}
  .det table{width:100%;border-collapse:collapse;font-size:18px;margin-top:8px}
  .det td{padding:6px 4px;border-bottom:1px solid var(--borde)} .det td:last-child{text-align:right;font-weight:700;white-space:nowrap}
  .admin{margin-top:14px;font-size:14px}
  @media (max-width:900px){ .pant{grid-template-columns:1fr} .pant .qrcol{position:static} .rk li{font-size:18px;grid-template-columns:40px 40px 1fr auto} .rk .t{display:none} }
</style>

<body>
<header>
  <img src="img/logo.png" alt="Alcaldía de Girardota">
  <div class="t">¿Sabe leer su casa?<small>Charla comunitaria · Sismo 10-ago-2026</small></div>
  <div class="pts oculto" id="marcador">0 pts</div>
</header>
<main id="app"></main>
<footer>Alcaldía de Girardota · Gestión del Riesgo de Desastres<br>girardota.gov.co · @alcaldiagirardota</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* BANCO DE PREGUNTAS — todas con fotos reales de las visitas del sismo en Girardota
   (recortadas sin datos de ubicación). A cada persona le salen al azar:
     10 de respuesta única (6 puntos c/u) + 5 de selección múltiple con fotos (8 puntos c/u) = 100.
   Tipos:
     img      → elegir UNA foto entre varias
     sem      → ver una foto y elegir UN color del semáforo
     foto     → ver una foto y elegir UNA respuesta
     imgmulti → marcar TODAS las fotos que cumplen (puntaje parcial: correctas − incorrectas) */
const UNICAS = [
  { id:"u01", tema:"Fisura vs. grieta", tipo:"img",
    q:"Después del temblor, don Jorge encontró estas afectaciones en paredes de su casa. Solo una la puede resanar él mismo y quedarse vigilándola, sin esperar visita técnica. ¿Cuál?",
    ops:[ {img:"img/afec82.jpg", nota:"Fisura en el revoque, sin profundidad: resanar y vigilar"},
          {img:"img/afec66.jpg", nota:"Grieta abierta que atraviesa la tapia"},
          {img:"img/afec72.jpg", nota:"Grietas en las uniones de muros de tapia"},
          {img:"img/afec113a.jpg", nota:"Grietas en muro y cubierta de tapia: requiere visita"} ],
    ok:0, exp:"La fisura va solo por el pañete o la pintura y no atraviesa el muro. Las otras comprometen el muro o la cubierta." },

  { id:"u02", tema:"Grieta que compromete el muro", tipo:"img",
    q:"Tres de estas afectaciones son superficiales y una ya compromete el muro. ¿Cuál NO se debe limitar a resanar?",
    ops:[ {img:"img/afec13.jpg", nota:"Fisuras en juntas de un edificio confinado: sin riesgo"},
          {img:"img/afec34.jpg", nota:"Fisura de revoque bajo la cubierta: sin riesgo"},
          {img:"img/afec113b.jpg", nota:"Grieta abierta que baja por la tapia hasta el piso"},
          {img:"img/afec64.jpg", nota:"Fisuras superficiales en zonas comunes"} ],
    ok:2, exp:"Una grieta abierta, que se ve con sombra y recorre el muro de arriba abajo, necesita revisión técnica: resanarla solo la esconde." },

  { id:"u03", tema:"Sistema constructivo", tipo:"img",
    q:"Las tres sintieron el mismo sismo. ¿En cuál los muros pierden resistencia cuando se humedecen y la cubierta suele quedar apoyada sin anclaje?",
    ops:[ {img:"img/edu26.jpg", nota:"Mampostería confinada (columnas y vigas)"},
          {img:"img/afec70.jpg", nota:"Tapia: muy alta vulnerabilidad"},
          {img:"img/inf6.jpg", nota:"Ladrillo con estructura"} ],
    ok:1, exp:"Es la tapia: tierra pesada que se debilita con la humedad. 7 de las 12 casas en estado crítico en Girardota eran de tapia." },

  { id:"u04", tema:"Terreno y ladera", tipo:"img",
    q:"En uno de estos casos, el técnico advirtió que reforzar los muros no basta si no se controla lo que pasa por fuera de la construcción. ¿Cuál?",
    ops:[ {img:"img/inf6.jpg", nota:"Edificio en terreno plano"},
          {img:"img/edu26.jpg", nota:"Edificio con estructura, terreno estable"},
          {img:"img/afec74.jpg", nota:"Vivienda en alta pendiente: el terreno también se revisa"} ],
    ok:2, exp:"En ladera, los cortes, los rellenos y el agua lluvia pueden mover la casa. Por eso el técnico también mira alrededor." },

  { id:"u05", tema:"Humedad y agua", tipo:"img",
    q:"En una de estas paredes el daño no se soluciona resanando ni reforzando el muro, porque la causa sigue actuando todos los días. ¿Cuál?",
    ops:[ {img:"img/afec50.jpg", nota:"Afectación irregular poco profunda"},
          {img:"img/inf4.jpg", nota:"Humedad junto a un bajante: pañete inflado y descascarado"},
          {img:"img/afec91.jpg", nota:"Grieta en muro divisorio"},
          {img:"img/afec64.jpg", nota:"Fisuras superficiales"} ],
    ok:1, exp:"El agua sigue entrando: primero se arregla el bajante y la humedad; si no, cualquier resane se vuelve a dañar." },

  { id:"u06", tema:"Cuándo evacuar", tipo:"img",
    q:"Doña Rosa ve estos daños en su casa mientras espera al técnico. ¿Cuál la obliga a sacar ya a la familia de esa zona?",
    ops:[ {img:"img/afec82.jpg", nota:"Fisura: resanar y vigilar"},
          {img:"img/afec72.jpg", nota:"Grietas en uniones de tapia: restringir y reforzar"},
          {img:"img/afec37b.jpg", nota:"Cielo raso y cubierta que se rompen y ceden"},
          {img:"img/afec10.jpg", nota:"Losa sin confinamiento: restringir el uso"} ],
    ok:2, exp:"Un techo que se rompe o se hunde es señal de peligro inmediato: salir, quedarse afuera y llamar. Las otras exigen restringir o vigilar." },

  { id:"u07", tema:"Causa previa al sismo", tipo:"img",
    q:"La familia culpó al sismo, pero el técnico concluyó que la causa principal venía de años atrás y que el temblor solo la destapó. ¿En cuál de estos casos?",
    ops:[ {img:"img/afec50.jpg", nota:"Afectación irregular reciente, poco profunda"},
          {img:"img/afec81.jpg", nota:"Cielo raso caído por un techo de tapia sin mantenimiento"},
          {img:"img/afec72.jpg", nota:"Grietas en uniones de muros de tapia"},
          {img:"img/afec23.jpg", nota:"Fisuras en la unión muro-viga"} ],
    ok:1, exp:"El cielo raso se cayó por falta de mantenimiento del techo. Decir la verdad sobre la causa define quién repara y qué ruta de apoyo aplica." },

  { id:"u08", tema:"Riesgo para adultos mayores", tipo:"img",
    q:"En la casa de una señora de 75 años que vive sola, el técnico dijo «no hay riesgo estructural, pero sí hay riesgo». ¿Cuál foto corresponde a ese caso?",
    ops:[ {img:"img/afec26.jpg", nota:"Baldosas levantadas: riesgo de caída de la persona"},
          {img:"img/afec98.jpg", nota:"Cubierta deteriorada: riesgo de colapso"},
          {img:"img/afec66.jpg", nota:"Grieta estructural en tapia"},
          {img:"img/afec37b.jpg", nota:"Techo que cede"} ],
    ok:0, exp:"Las baldosas levantadas no tumban la casa, pero pueden hacer caer a una persona mayor. Se recomendó revoque y reorganizar las baldosas." },

  { id:"u09", tema:"Semáforo: verde", tipo:"sem", img:"img/afec23.jpg",
    q:"Apartamento en el centro: las afectaciones siguen la unión entre el muro de ladrillo y la viga; las columnas no muestran daño y nada se ve por el otro lado del muro. ¿Qué color corresponde?",
    ok:"v", exp:"VERDE: se puede habitar. La estructura está sana; se resana y se vigila. En Girardota 33 casas quedaron en verde." },

  { id:"u10", tema:"Semáforo: naranja", tipo:"sem", img:"img/afec72.jpg",
    q:"Casa de tapia en una vereda: grietas abiertas donde se unen los muros; el techo sigue en su sitio y los muros no están inclinados. Vive una adulta mayor. ¿Qué color corresponde?",
    ok:"n", exp:"NARANJA (amarillo en el país): uso restringido. No usar la parte dañada y reforzar pronto, confinando con columnas y vigas. No hay riesgo inminente de colapso." },

  { id:"u11", tema:"Semáforo: rojo", tipo:"sem", img:"img/afec98.jpg",
    q:"Casa de tapia: varias vigas de madera de la cubierta están descompuestas por la humedad y se apoyan directamente sobre la tapia; algunas piezas ya cedieron. ¿Qué color corresponde?",
    ok:"r", exp:"ROJO: crítico, no entrar a esa zona. Ojo: el rojo NO es una orden de demoler. Se recomendó no usar la zona y cambiar la cubierta." },

  { id:"u12", tema:"Semáforo: losa sin confinar", tipo:"sem", img:"img/afec10.jpg",
    q:"Local comercial: una losa intermedia, construida sin columnas ni vigas que la confinen, quedó con grietas en varias direcciones; debajo guardan motos. Las columnas principales están bien. ¿Qué color corresponde a esa zona?",
    ok:"n", exp:"NARANJA: uso restringido de la zona de la losa. No se puede caminar encima ni usar la parte de abajo hasta reforzarla; otro sismo fuerte podría tumbarla." },

  { id:"u13", tema:"Semáforo: edificio confinado", tipo:"sem", img:"img/afec13.jpg",
    q:"Edificio de varios pisos: fisuras en las juntas entre columnas y muros y en los marcos de ventanas; algunas son antiguas y se abrieron con el sismo. Columnas y vigas sin daño. ¿Qué color corresponde?",
    ok:"v", exp:"VERDE: sin riesgo habitacional. Las fisuras están en la mampostería, no en la estructura. Se recomienda reparar los muros y vigilar." },

  { id:"u14", tema:"Semáforo: tapia deformada", tipo:"sem", img:"img/afec55.jpg",
    q:"Casa de tapia en una vereda: por fuera se ve bien, pero por dentro los muros perdieron su forma y se ven abombados. Viven 4 personas. ¿Qué color corresponde?",
    ok:"r", exp:"ROJO: un muro barrigón o deformado es señal de peligro. Que la fachada se vea bien no quiere decir que la casa esté bien." },

  { id:"u15", tema:"Semáforo: verde con vigilancia", tipo:"sem", img:"img/afec69.jpg",
    q:"Casa tradicional: solo daños menores en muros, pero el técnico pidió a la familia observar el comportamiento del techo de la sala. ¿Qué color le dieron?",
    ok:"v", exp:"VERDE con observaciones: se puede habitar, pero hay que vigilar el techo de la sala. Verde no quiere decir «olvídese de la casa»." },

const N_UNICAS = 10, N_MULTI = 5, PTS_UNICA = 6, PTS_MULTI = 8;
const N_PREG = N_UNICAS + N_MULTI, TOTAL = N_UNICAS*PTS_UNICA + N_MULTI*PTS_MULTI;
const BANCO = Object.fromEntries([...UNICAS, ...MULTIPLES].map(p => [p.id, p]));
// Base de datos en vivo (Firebase Realtime Database, API REST; sin librerías).
const DB = "https://festival-del-chicharron-2026-default-rtdb.firebaseio.com/sismo2026/respuestas";
const GANADORES = 8;
const SEM = { v:["VERDE","Habitable"], n:["NARANJA","Uso restringido"], r:["ROJO","Crítico"] };
const LETRAS = "ABCDEFGH";
const app = document.getElementById('app');
const marcador = document.getElementById('marcador');
let st, PQ = [];

function barajar(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// Sorteo por persona: preguntas al azar del banco y opciones en distinto orden.
function prepararPreguntas(){
  const elegidas = [...barajar(UNICAS).slice(0, N_UNICAS).map(p => ({...p, pts:PTS_UNICA})),
                    ...barajar(MULTIPLES).slice(0, N_MULTI).map(p => ({...p, pts:PTS_MULTI}))];
  return barajar(elegidas).map(p => {
    if (p.tipo === 'img' || p.tipo === 'foto') { const orden = barajar(p.ops.map((_,k)=>k)); return {...p, ops:orden.map(k=>p.ops[k]), ok:orden.indexOf(p.ok)}; }
    if (p.tipo === 'imgmulti') return {...p, ops:barajar(p.ops)};
    return p;
  });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (Math.round(n*10)/10).toString().replace('.', ',');
function setMarcador(){ marcador.textContent = fmt(st.puntos) + " pts"; }

function cabecera(p){
  const tipos = { img:"Elija UNA foto", sem:"Elija UN color", foto:"Elija UNA respuesta", imgmulti:"Selección múltiple: marque TODAS las fotos correctas" };
  return `<div class="bar"><i style="width:${st.i/N_PREG*100}%"></i></div>
  <div class="card">
    <div class="kicker">Pregunta ${st.i+1} de ${N_PREG} <span class="valor">${p.pts} puntos</span></div>
    <h2>${esc(p.q)}</h2>
    <p class="tipo">${tipos[p.tipo]}</p>`;
}

function pregunta(){
  const p = PQ[st.i];
  let cuerpo = "";
  const tarjeta = (o,k) => `<button class="imgop" data-k="${k}"><img src="${o.img}" alt="Opción ${LETRAS[k]}"><span class="letra">${LETRAS[k]}</span><span class="nota">${esc(o.nota)}</span></button>`;
  if (p.tipo === "img") {
    cuerpo = `<div class="grid" id="opts">${p.ops.map(tarjeta).join('')}</div>`;
  } else if (p.tipo === "imgmulti") {
    cuerpo = `<div class="grid${p.ops.length > 6 ? ' g3' : ''}" id="opts">${p.ops.map(tarjeta).join('')}</div>
      <button class="btn" id="calif" disabled>Calificar</button>`;
  } else if (p.tipo === "sem") {
    cuerpo = `<img class="foto" src="${p.img}" alt="Foto de la visita">
      <div class="sem">${Object.keys(SEM).map(c=>`<button class="semop ${c}" data-c="${c}"><div class="luz"></div>${SEM[c][0]}<small>${SEM[c][1]}</small></button>`).join('')}</div>`;
  } else {
    cuerpo = `<img class="foto" src="${p.img}" alt="Foto de la visita">
      <div class="ops">${p.ops.map((o,k)=>`<button class="op" data-k="${k}"><b>${LETRAS[k]}</b><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  app.innerHTML = cabecera(p) + cuerpo + `<div id="fb"></div></div>`;

  if (p.tipo === "img") app.querySelectorAll('.imgop').forEach(b => b.onclick = () => respImg(+b.dataset.k));
  if (p.tipo === "foto") app.querySelectorAll('.op').forEach(b => b.onclick = () => respFoto(+b.dataset.k));
  if (p.tipo === "sem") app.querySelectorAll('.semop').forEach(b => b.onclick = () => respSem(b.dataset.c));
  if (p.tipo === "imgmulti") {
    const cal = document.getElementById('calif');
    app.querySelectorAll('.imgop').forEach(b => b.onclick = () => {
      b.classList.toggle('sel');
      cal.disabled = !app.querySelector('.imgop.sel');
    });
    cal.onclick = respImgMulti;
  }
  window.scrollTo(0,0);
}

function cerrar(pts, titulo, bien){
  const p = PQ[st.i];
  st.puntos += pts; st.resp.push({ pts }); setMarcador();
  const ultima = st.i === N_PREG - 1;
  document.getElementById('fb').innerHTML = `
    <div class="fb ${bien?'ok':'mal'}"><strong>${titulo}</strong>${esc(p.exp)}</div>
    <button class="btn" id="sig">${ultima?'Ver mi puntaje':'Siguiente'}</button>`;
  document.getElementById('sig').onclick = () => { st.i++; ultima ? final() : pregunta(); };
  document.getElementById('sig').scrollIntoView({behavior:'smooth', block:'end'});
}

function respImg(k){
  const p = PQ[st.i], bien = k === p.ok;
  const btns = app.querySelectorAll('.imgop');
  btns.forEach(b => b.disabled = true);
  btns[p.ok].classList.add('ok'); if (!bien) btns[k].classList.add('mal');
  document.getElementById('opts').classList.add('revelado');
  cerrar(bien ? p.pts : 0, bien ? `¡Correcto! +${p.pts} puntos` : `No era esa. La correcta es la ${LETRAS[p.ok]}`, bien);
}

function respFoto(k){
  const p = PQ[st.i], bien = k === p.ok;
  const btns = app.querySelectorAll('.op');
  btns.forEach(b => b.disabled = true);
  btns[p.ok].classList.add('ok'); if (!bien) btns[k].classList.add('mal');
  cerrar(bien ? p.pts : 0, bien ? `¡Correcto! +${p.pts} puntos` : `No era esa. La correcta es la ${LETRAS[p.ok]}`, bien);
}

function respSem(c){
  const p = PQ[st.i], bien = c === p.ok;
  app.querySelectorAll('.semop').forEach(b => { b.disabled = true;
    if (b.dataset.c === p.ok) b.classList.add('ok'); else if (b.dataset.c === c) b.classList.add('mal'); });
  cerrar(bien ? p.pts : 0, bien ? `¡Correcto! +${p.pts} puntos` : `No era ese color`, bien);
}

function respImgMulti(){
  const p = PQ[st.i];
  const total = p.ops.filter(o=>o.ok).length;
  let aciertos = 0, errores = 0;
  app.querySelectorAll('.imgop').forEach(b => {
    const o = p.ops[+b.dataset.k], marcada = b.classList.contains('sel');
    b.disabled = true; b.classList.remove('sel');
    if (marcada && o.ok) { aciertos++; b.classList.add('ok'); }
    else if (marcada && !o.ok) { errores++; b.classList.add('mal'); }
    else if (!marcada && o.ok) b.classList.add('falto');
  });
  document.getElementById('opts').classList.add('revelado');
  document.getElementById('calif').remove();
  // Cada foto correcta marcada suma; cada incorrecta marcada resta. Mínimo 0.
  const pts = Math.max(0, aciertos - errores) / total * p.pts;
  const completo = aciertos === total && errores === 0;
  cerrar(pts, completo ? `¡Perfecto! +${p.pts} puntos` : `${aciertos} de ${total} correctas${errores?`, ${errores} de más`:''} · +${fmt(pts)} puntos`, completo);
}

      return `<li><span>${j+1}. ${esc(p.tema)}</span><span class="s" style="color:${c}">${fmt(r)}/${p.pts}</span></li>`; }).join('')}</ul>

    <div class="fb ok"><strong>Recuerde</strong>Una grieta es un mensaje de la casa. Si ve señales de peligro, salga, quédese afuera y llame al 123.</div>
    <button class="btn sec" id="otra">Volver al inicio</button>
  </div>`;
  document.getElementById('otra').onclick = inicio;
  window.scrollTo(0,0);
  if (!st.enviado) enviar();

async function enviar(){
  const el = document.getElementById('envio');
  st.seg = st.seg || Math.round((Date.now() - st.t0) / 1000);
  const dato = { nombre: st.nombre.slice(0,50), vereda: st.vereda.slice(0,40),
    puntos: Math.round(st.puntos*10)/10, seg: st.seg,
    completas: st.resp.filter((r,j)=>r.pts >= PQ[j].pts).length,
    q: PQ.map(p=>p.id), det: st.resp.map(r=>Math.round(r.pts*10)/10), ts: Date.now() };
  try {
    const r = await fetch(DB + ".json", { method:"POST", body: JSON.stringify(dato) });
    if (!r.ok) throw new Error(r.status);
    st.enviado = true;
    if (el) { el.className = "envio ok"; el.textContent = "✔ Su resultado ya aparece en la pantalla del ranking."; }
  } catch (e) {
    if (el) { el.className = "envio err"; el.innerHTML = `No se pudo enviar (revise la señal). <button class="btn sec" id="reenv" style="margin-top:8px">Reintentar envío</button>`;
      document.getElementById('reenv').onclick = () => { el.className = "envio"; el.textContent = "Enviando…"; enviar(); }; }
  }
}

function vistaPantalla(){
  marcador.classList.add('oculto');
  document.body.classList.add('pantalla');
  const url = location.origin + location.pathname;
  const admin = /admin/.test(location.hash);
  app.innerHTML = `
  <div class="pant">
    <div class="card qrcol">
      <div id="qrbox"></div>
      <div class="qrtxt">
        <div class="kicker">Escanee con la cámara del celular</div>
        <h1 style="margin:4px 0 0">¿Sabe leer su casa?</h1>
        <p class="pasos">Cuestionario individual · ${N_PREG} preguntas con fotos · ${TOTAL} puntos.<br>Al terminar, su puntaje aparece aquí abajo.</p>
        <p class="cuenta"><b id="nPart">0</b> participantes registrados</p>
        <div class="url">${esc(url)}</div>
        ${admin ? `<div class="admin"><button class="btn sec" id="borrar">Borrar todos los resultados</button></div>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="rk-h"><h1>Ranking en vivo</h1><span class="vivo"><i></i>se actualiza solo</span></div>
      <p class="tipo" style="margin:4px 0 0">👑 1.º puesto · 💪 2.º y 3.º · 🎈 4.º al ${GANADORES}.º. Los ${GANADORES} primeros ganan. Si hay empate, gana quien terminó en menos tiempo. Toque un nombre para ver el detalle.</p>
      <div id="rk"><div class="vacio">Esperando las primeras respuestas…</div></div>
    </div>
  </div>`;
  if (window.QRCode) new QRCode(document.getElementById('qrbox'), { text:url, width:270, height:270, colorDark:"#0c5644", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
  else document.getElementById('qrbox').textContent = "No se pudo cargar el generador de QR (revise la conexión).";
  if (admin) document.getElementById('borrar').onclick = async () => {
    if (!confirm("¿Borrar TODOS los resultados del ranking? No se puede deshacer.")) return;
    await fetch(DB + ".json", { method:"DELETE" }); cargarRanking();
  };
  cargarRanking();
  clearInterval(pollTimer); pollTimer = setInterval(cargarRanking, 3000);
}

async function cargarRanking(){
  let datos;
  const v = document.querySelector('.vivo');
  try { const r = await fetch(DB + ".json?t=" + Date.now()); if (!r.ok) throw 0; datos = await r.json() || {}; }
  catch (e) { if (v) v.innerHTML = '<i style="background:var(--rojo)"></i>sin conexión, reintentando…'; return; }
  if (v) v.innerHTML = '<i></i>se actualiza solo';
  // Cuenta solo el PRIMER intento de cada nombre.
  const porNombre = {};
  Object.values(datos).filter(d => d && d.nombre).sort((a,b)=>a.ts-b.ts)
    .forEach(d => { const k = clave(d.nombre); if (!porNombre[k]) porNombre[k] = d; });
  ULTIMO = Object.values(porNombre).sort((a,b)=> b.puntos - a.puntos || a.seg - b.seg || a.ts - b.ts);
  const n = document.getElementById('nPart'); if (n) n.textContent = ULTIMO.length;
  const box = document.getElementById('rk'); if (!box) return;
  if (!ULTIMO.length) { box.innerHTML = '<div class="vacio">Esperando las primeras respuestas…</div>'; return; }
  const fila = (d,i) => `<li class="${i < GANADORES ? 'gana' : ''} ${['oro','plata','bronce'][i] || ''}" data-i="${i}">
      <span class="ico">${i === 0 ? '👑' : i < 3 ? '💪' : i < GANADORES ? '🎈' : ''}</span>
      <span class="pos">${i+1}</span>
      <span class="nom">${esc(d.nombre)}${i === 0 ? '<span class="tag">GANADOR</span>' : ''}${d.vereda ? `<small>${esc(d.vereda)}</small>` : ''}</span>
      <span class="t">${d.completas ?? '–'}/${N_PREG} completas<br>${mmss(d.seg||0)} min</span>
      <span class="p">${fmt(d.puntos)}</span></li>`;
  const top = ULTIMO.slice(0, GANADORES), resto = ULTIMO.slice(GANADORES);
  box.innerHTML = `<ul class="rk">${top.map(fila).join('')}</ul>` +
    (resto.length ? `<div class="corte">Demás participantes</div><ul class="rk">${resto.map((d,i)=>fila(d,i+GANADORES)).join('')}</ul>` : '');
  box.querySelectorAll('li').forEach(li => li.onclick = () => detalle(+li.dataset.i));
}

function detalle(i){
  const d = ULTIMO[i]; if (!d) return;
  const filas = (d.q || []).map((id,j) => {
    const p = BANCO[id] || { tema:id, tipo:'' }, max = p.tipo === 'imgmulti' ? PTS_MULTI : PTS_UNICA;
    const r = (d.det||[])[j] ?? 0, c = r >= max ? 'var(--verde)' : r > 0 ? 'var(--naranja)' : 'var(--rojo)';
    return `<tr><td>${j+1}. ${esc(p.tema)}</td><td style="color:${c}">${fmt(r)} / ${max}</td></tr>`; }).join('');
  const w = document.createElement('div'); w.className = 'det';
  w.innerHTML = `<div class="card">
    <div class="kicker">Puesto ${i+1}${i < GANADORES ? ' · GANADOR' : ''}</div>
    <h1 style="margin:4px 0">${esc(d.nombre)}</h1>
    <p style="margin:0">${d.vereda ? esc(d.vereda) + ' · ' : ''}<b>${fmt(d.puntos)} / ${TOTAL} puntos</b> · ${d.completas ?? '–'} de ${N_PREG} preguntas completas · ${mmss(d.seg||0)} min</p>
    <table>${filas}</table>
    <button class="btn sec" id="cerrarDet">Cerrar</button></div>`;
  document.body.appendChild(w);
  const cerrarDet = () => w.remove();
  w.onclick = e => { if (e.target === w) cerrarDet(); };
  w.querySelector('#cerrarDet').onclick = cerrarDet;
}

function ruta(){
  clearInterval(pollTimer);
  if (location.hash.startsWith('#qr') || location.hash.startsWith('#ranking')) vistaPantalla();
  else { document.body.classList.remove('pantalla'); inicio(); }
}
window.addEventListener('hashchange', ruta);
ruta();
</script>
</body>
</html>
